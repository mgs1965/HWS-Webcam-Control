<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raspberry Pi health</title>
</head><body class="s-base"><div class="s-page">
<header class="s-head"><h1>Raspberry Pi health</h1><div class="s-nav muted">__NAV__</div></header>
<div class="s-tiles" id="tiles"></div>
<div class="s-tabs" id="tabs"></div>
<div class="s-grid" id="charts"></div>
<div class="s-card" id="fc" hidden><h2>Disk forecast</h2><p id="fct"></p></div>
<script type="application/json" id="data">__DATA__</script>
<script>
const {D,$,has,el,tile}=HWS.page();
const F=(v,d,u,delta)=>HWS.fmt(v,d,u,delta),NS='http://www.w3.org/2000/svg';

const M=D.metrics||{},S=D.series||{},T=$('tiles');
tile(T,'CPU temperature',F(M.cpu_temp_c,1,'°C'));tile(T,'CPU load',F(M.cpu_load_percent,0,'%'));tile(T,'Memory',F(M.memory_percent,0,'%'));tile(T,'Disk used',F(M.disk_percent,0,'%'));tile(T,'Disk free',F(M.disk_free_gb,1,' GB'));
tile(T,'Uptime',has(M.host_uptime_seconds)?(M.host_uptime_seconds/86400).toFixed(1)+' days':'–');tile(T,'Camera app memory',F(M.process_rss_mb,0,' MB'));tile(T,'Restarts',has(M.restart_count)?String(M.restart_count):'–');
const SPEC=[['cpu_temperature','CPU temperature (°C)','#ff6075'],['cpu_load','CPU load (%)','#ffd166'],['system_memory','Memory (%)','#4ea9ff'],['disk_used','Disk used (%)','#4bd66a']];
function draw(range){const g=$('charts');g.textContent='';for(const b of $('tabs').children)b.classList.toggle('on',b.dataset.range===range);for(const[k,l,col]of SPEC){const c=el('section','s-card',undefined,g);el('h2','',l,c);const pts=(((S[range]||{})[k])||[]).filter(p=>has(p[1]));if(pts.length<2){el('p','muted','No data yet',c);continue}
 const vs=pts.map(p=>p[1]),lo0=Math.min(...vs),hi0=Math.max(...vs),padv=((hi0-lo0)||1)*.1,lo=lo0-padv,hi=hi0+padv,t0=pts[0][0],t1=pts[pts.length-1][0],L=38,W=300,H=100,X=t=>L+(t-t0)/(t1-t0||1)*(W-L),Y=v=>H-(v-lo)/(hi-lo)*H;
 const fm=v=>Math.abs(hi-lo)>=5?Math.round(v):v.toFixed(1),tm=t=>{const d=new Date(t);return range==='24h'?d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString([],{day:'numeric',month:'short'})};
 let s='<svg viewBox="0 0 '+(W+4)+' '+(H+18)+'" style="width:100%;height:auto;font-size:8px" fill="#a9bdce">';
 for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3,y=Y(v);s+='<line x1="'+L+'" x2="'+W+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="#2a4960" stroke-width=".5"/><text x="'+(L-3)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end">'+fm(v)+'</text>'}
 for(let i=0;i<=4;i++){const t=t0+(t1-t0)*i/4;s+='<text x="'+X(t).toFixed(1)+'" y="'+(H+12)+'" text-anchor="'+(i===0?'start':i===4?'end':'middle')+'">'+tm(t)+'</text>'}
 s+='<polyline fill="none" stroke="'+col+'" stroke-width="1.5" stroke-linejoin="round" points="'+pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')+'"/></svg>';c.insertAdjacentHTML('beforeend',s);el('div','muted','Min '+fm(lo0)+' · max '+fm(hi0)+' · now '+fm(vs[vs.length-1]),c)}}
for(const[k,l]of[['24h','24h'],['7d','7d'],['month','Month']]){if(S[k]){const a=el('button','s-btn',l,$('tabs'));a.dataset.range=k;a.onclick=()=>draw(k)}}
draw(S['24h']?'24h':Object.keys(S)[0]);
const DF=D.disk_forecast;if(DF&&typeof DF==='object'){$('fc').hidden=false;$('fct').textContent=has(DF.used_percent)?(DF.days_to_full===null||DF.days_to_full===undefined?'Disk is '+DF.used_percent+'% used and stable (changing '+(DF.percent_per_day||0)+'% per day), so it is not forecast to fill up.':'Disk is '+DF.used_percent+'% used, growing '+DF.percent_per_day+'% per day: full in about '+DF.days_to_full+' days.'):'Not enough data yet.'}else{$('fc').hidden=false;$('fct').textContent='Not enough history yet: the forecast needs at least 2 days of disk readings.'}
</script></div></body></html>
