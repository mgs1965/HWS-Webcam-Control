<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Almanac</title>
<style>:root{color-scheme:dark;--bg:#071827;--card:#0e273b;--line:#2a4960;--text:#edf6ff;--muted:#a9bdce;--blue:#4ea9ff;--amber:#ffd166;--green:#4bd66a;--red:#ff6075}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,"Segoe UI",sans-serif}a{color:var(--blue)}.muted{color:var(--muted)}</style></head><body><div class="s-page">
<header class="s-head"><h1>Almanac</h1><div class="s-nav muted">__NAV__</div></header>
<div class="s-tiles" id="tiles"></div><div class="s-card"><h2>Tonight</h2><div id="tonight"></div></div><div class="s-card s-scroll"><h2>Next 14 days</h2><table class="s-table" id="tbl"></table></div><p class="muted">Times are calculated for the station location. The dark window is when the sun is more than 18° below the horizon; in summer it may not occur.</p>
<script type="application/json" id="data">__DATA__</script>
<script>
const raw=document.getElementById('data').textContent.trim(),D=raw.startsWith('{')?JSON.parse(raw):{},$=id=>document.getElementById(id),has=v=>v!==null&&v!==undefined&&v!==''&&isFinite(Number(v));
const el=(tag,cls,text,parent)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;if(parent)parent.append(e);return e};
const F=(v,d,u,delta)=>HWS.fmt(v,d,u,delta),day=s=>new Date(s+'T12:00:00'),hm=s=>s?new Date(s).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'–';
const tile=(box,k,v)=>{const t=el('div','s-tile',undefined,box);el('div','k',k,t);el('div','v',v,t)};
const sm=D.sun_moon||{},m=sm.moon||{},A=D.almanac||[],sc=D.scene||{},dur=s=>has(s)?Math.floor(s/3600)+'h '+String(Math.round(s%3600/60)).padStart(2,'0')+'m':'–';
const t=$('tiles');tile(t,'Sunrise',hm(sm.sunrise));tile(t,'Sunset',hm(sm.sunset));tile(t,'Solar noon',hm(sm.solar_noon));tile(t,'Day length',dur(sm.day_length_seconds));tile(t,'Golden hour (am)','until '+hm(sm.golden_morning_end));tile(t,'Golden hour (pm)','from '+hm(sm.golden_evening_start));tile(t,'Moon',m.phase||'–');tile(t,'Illumination',has(m.illumination_percent)?Math.round(m.illumination_percent)+'%':'–');tile(t,'Next full moon',m.next_full||'–');tile(t,'Next new moon',m.next_new||'–');tile(t,'Sun elevation',has(sm.elevation)?Number(sm.elevation).toFixed(1)+'°':'–');
const n=A[0]||{},tn=$('tonight'),row=(k,v)=>{const r=el('div','',undefined,tn);r.style.cssText='display:flex;justify-content:space-between;padding:3px 0';el('span','muted',k,r);el('b','',v,r)};
row('Dark-sky window',n.dark_start?hm(n.dark_start)+' to '+hm(n.dark_end):'No astronomical darkness tonight');row('Moon',(n.moon||'–')+(has(n.moon_illumination)?' ('+Math.round(n.moon_illumination)+'%)':''));row('Cloud (camera estimate)',has(sc.cloud_cover_pct)?Math.round(sc.cloud_cover_pct)+'%':'–');row('Visibility (camera)',sc.visibility||'–');row('Humidity',F((D.weather||{}).humidity_percent,0,'%'));
const tb=$('tbl'),h=tb.insertRow();for(const x of['Date','Sunrise','Sunset','Day length','Dark window','Moon']){const c=document.createElement('th');c.textContent=x;h.append(c)}
for(const a of A){const r=tb.insertRow();r.insertCell().textContent=day(a.date).toLocaleDateString([],{weekday:'short',day:'numeric',month:'short'});r.insertCell().textContent=hm(a.sunrise);r.insertCell().textContent=hm(a.sunset);r.insertCell().textContent=dur(a.day_length_seconds);r.insertCell().textContent=a.dark_start?hm(a.dark_start)+'–'+hm(a.dark_end):'none';r.insertCell().textContent=(a.moon||'')+' '+(has(a.moon_illumination)?Math.round(a.moon_illumination)+'%':'')}
</script></div></body></html>
