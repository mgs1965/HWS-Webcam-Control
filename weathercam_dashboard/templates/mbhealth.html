<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meteobridge health</title>
<style>:root{color-scheme:dark;--bg:#071827;--card:#0e273b;--line:#2a4960;--text:#edf6ff;--muted:#a9bdce;--blue:#4ea9ff;--amber:#ffd166;--green:#4bd66a;--red:#ff6075}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,"Segoe UI",sans-serif}a{color:var(--blue)}.muted{color:var(--muted)}</style></head><body><div class="s-page">
<header class="s-head"><h1>Meteobridge health</h1><div class="s-nav muted">__NAV__</div></header>
<div class="s-grid" id="grid"></div>
<script type="application/json" id="data">__DATA__</script>
<script>
const raw=document.getElementById('data').textContent.trim(),D=raw.startsWith('{')?JSON.parse(raw):{},$=id=>document.getElementById(id),has=v=>v!==null&&v!==undefined&&v!==''&&isFinite(Number(v));
const el=(tag,cls,text,parent)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;if(parent)parent.append(e);return e};
const F=(v,d,u,delta)=>HWS.fmt(v,d,u,delta),NS='http://www.w3.org/2000/svg';
const tile=(box,k,v)=>{const t=el('div','s-tile',undefined,box);el('div','k',k,t);el('div','v',v,t)};

const H=D.health||{},W=D.weather||{},ICON={ok:'✅',warn:'⚠️',bad:'❌',unknown:'❔'};
let c=el('section','s-card',undefined,$('grid'));el('h2','',"Checks",c);
for(const k of H.checks||[]){const r=el('div','',undefined,c);r.style.cssText='display:flex;justify-content:space-between;gap:8px;padding:4px 0';el('span','',(ICON[k.status]||'')+' '+k.name,r);el('span','muted',k.detail,r)}
c=el('section','s-card',undefined,$('grid'));el('h2','',"History",c);const t=el('table','s-table',undefined,c);
for(const[a,b]of[['Days stored',H.days_stored],['First stored day',H.first_day],['Archive days (Meteobridge import)',H.archive_days],['Archive from',H.archive_first],['Archive to',H.archive_last],['Missing in last 30 days',(H.gaps||[]).join(', ')||'none']]){const r=t.insertRow();r.insertCell().textContent=a;r.insertCell().textContent=b??'–'}
c=el('section','s-card',undefined,$('grid'));el('h2','',"Source",c);const t2=el('table','s-table',undefined,c);
for(const[a,b]of[['Source',W.source],['Updated',W.updated],['Bridge data age (s)',W.bridge_data_age_s],['Station note',H.station_message]]){const r=t2.insertRow();r.insertCell().textContent=a;r.insertCell().textContent=b??'–'}
c=el('section','s-card',undefined,$('grid'));el('h2','',"Meteobridge data",c);
const tiles=el('div','s-tiles',undefined,c);
tile(tiles,'CPU load',has(W.cpu_load_percent)?F(W.cpu_load_percent,1,'%'):'–');
tile(tiles,'Uptime',F(W.bridge_uptime_hours,1,' hours'));
tile(tiles,'Storage usage',has(W.storage_usage_percent)?F(W.storage_usage_percent,1,'%'):'–');
tile(tiles,'RAM usage',has(W.ram_usage_percent)?F(W.ram_usage_percent,1,'%'):'–');
tile(tiles,'Power consumption',has(W.power_consumption_w)?F(W.power_consumption_w,2,' W'):'–');
tile(tiles,'Processes',has(W.process_count)?String(Math.round(W.process_count)):'–');
tile(tiles,'Data age',has(W.bridge_data_age_s)?F(W.bridge_data_age_s,0,' s'):'–');
tile(tiles,'Voltage',has(W.voltage_v)?F(W.voltage_v,2,' V'):'–');
tile(tiles,'Current',has(W.current_a)?F(W.current_a,3,' A'):'–');
tile(tiles,'Signal minimum (5 min)',F(W.signal_min,0,''));
tile(tiles,'Signal maximum (5 min)',F(W.signal_max,0,''));

c=el('section','s-card',undefined,$('grid'));el('h2','',"Health trends",c);
const tabs=el('div','s-tabs',undefined,c),chart=el('div','',undefined,c);
const specs=[['CPU load','cpu_load_percent','%', '#ff6075'],['Uptime','bridge_uptime_hours','h','#4ea9ff'],['Storage usage','storage_usage_percent','%','#ffd166'],['RAM usage','ram_usage_percent','%','#43aa8b'],['Power','power_consumption_w','W','#ff9f43'],['Processes','process_count','','#c77dff'],['Data age','bridge_data_age_s','s','#a9bdc9'],['Voltage','voltage_v','V','#4ea9ff'],['Current','current_a','A','#ff6075']];
function renderPeriod(period){
 chart.textContent='';
 const G=D.graphs||{};
 let series=G[period]||G['24h']||{t:[]};
 if(period==='daily'){
  const end=Date.parse(D.generated||'');const daily=(G.daily||[]).filter(r=>{const t=Date.parse(r.date+'T00:00:00Z');return Number.isFinite(end)&&t>=end-366*864e5&&t<=end});
  series={t:daily.map(r=>r.date?r.date+'T12:00:00Z':null)};
  const map={
   cpu_load_percent:'cpu_load_avg',bridge_uptime_hours:'uptime_last',
   storage_usage_percent:'storage_usage_avg',ram_usage_percent:'ram_usage_avg',
   power_consumption_w:'power_consumption_avg',process_count:'process_count_avg',
   bridge_data_age_s:'data_age_avg',voltage_v:'voltage_avg',current_a:'current_avg'};
  for(const[name,key]of specs){
   series[key]=daily.map(r=>r[map[key]]);
  }
  for(const key of ['signal_min','signal_max'])series[key]=daily.map(r=>r[key]);
 }
 for(const[name,key,unit,color]of specs){
  const pts=(series.t||[]).map((t,i)=>[Date.parse(t),series[key]?.[i]]).filter(p=>has(p[1]));
  if(!pts.length)continue;
  const box=el('div','',undefined,chart);el('h3','',name,box);
  HWS.chart(box,{series:[{name,color,pts}],unit,dig:key==='bridge_uptime_hours'||key==='bridge_data_age_s'||key==='process_count'?0:key==='current_a'?3:1,xfmt:t=>period==='24h'?new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):new Date(t).toLocaleDateString([],{day:'numeric',month:'short'})});
 }
  const signal=[['Minimum','signal_min','#ff6075'],['Maximum','signal_max','#4ea9ff']].map(([name,key,color])=>({name,color,pts:(series.t||[]).map((t,i)=>[Date.parse(t),series[key]?.[i]]).filter(p=>Number.isFinite(p[0])&&has(p[1]))})).filter(s=>s.pts.length);
  if(signal.length){const box=el('div','',undefined,chart);el('h3','','Signal strength',box);el('p','muted','Minimum and maximum reported for each interval.',box);HWS.chart(box,{series:signal,dig:0,xfmt:t=>period==='24h'?new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):new Date(t).toLocaleDateString([],{day:'numeric',month:'short'})});}
 if(!chart.children.length)el('p','muted','No data available for this period yet.',chart);
}
for(const[period,label]of[['24h','24 hours'],['7d','7 days'],['month','Month'],['daily','Year']]){
 const b=el('button','',label,tabs);b.type='button';b.onclick=()=>{tabs.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');renderPeriod(period)};
 if(period==='24h')b.classList.add('on');
}
renderPeriod('24h');
</script></div></body></html>
