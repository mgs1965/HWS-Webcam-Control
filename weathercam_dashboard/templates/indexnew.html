<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harpenden Weather Station</title>
<style>:root{color-scheme:dark;--bg:#071827;--card:#0e273b;--line:#2a4960;--text:#edf6ff;--muted:#a9bdce;--blue:#4ea9ff;--amber:#ffd166;--green:#4bd66a;--red:#ff6075}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,"Segoe UI",sans-serif}a{color:var(--blue)}.muted{color:var(--muted)}.hero{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}.hero>*{flex:1 1 320px}.fc{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.fc>div{text-align:center;border:1px solid var(--line);border-radius:10px;padding:8px}.fc .i{font-size:28px}</style></head><body><div class="s-page">
<header class="s-head"><h1><img src="logo.svg" alt="" style="height:56px;vertical-align:middle;margin-right:12px">Harpenden Weather Station</h1><div class="s-nav muted">__NAV__</div></header>
<a id="kgbanner" href="webcam.html" style="display:none;margin-bottom:12px"><img id="kgimg" alt="Today's sky keogram" style="width:100%;height:170px;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block"><span class="muted" id="kgnote"></span></a>
<div class="muted" style="margin:-6px 0 10px"><span id="dot" class="s-dot off"></span><span id="status">Waiting for data</span></div>
<div class="s-tiles" id="tiles"></div>
<div class="hero"><div class="s-card s-media"><h2>Latest from the camera</h2><img src="latest.jpg" alt="Latest weather camera image" id="cam" onerror="this.hidden=true"><div class="muted" id="camnote" style="margin-top:6px"></div></div>
<div class="s-card"><h2>Temperature, last 24 hours</h2><div id="spark"></div><h2 style="margin-top:14px">Sun and moon</h2><div id="sun"></div></div></div>
<div class="s-card"><h2>Forecast</h2><div class="fc" id="fc"></div><p class="muted"><a href="forecast.html">Full forecast</a></p></div>
<div class="s-card" id="notes" hidden><h2>Conditions</h2><ul id="notelist"></ul></div>
<div class="s-card"><h2>More</h2><div class="s-tabs" id="links"></div></div>
<script type="application/json" id="data">__DATA__</script>
<script>
const raw=document.getElementById('data').textContent.trim(),D=raw.startsWith('{')?JSON.parse(raw):{},$=id=>document.getElementById(id),has=v=>v!==null&&v!==undefined&&v!==''&&isFinite(Number(v));
const el=(tag,cls,text,parent)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;if(parent)parent.append(e);return e};
if(D.keogram&&D.keogram.filename){$('kgimg').src=D.keogram.filename;$('kgnote').textContent='Sky keogram, '+(D.keogram.date||'latest');$('kgbanner').style.display='block'}
const F=(v,d,u,delta)=>HWS.fmt(v,d,u,delta),day=s=>new Date(s+'T12:00:00'),hm=s=>s?new Date(s).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'–';
const tile=(box,k,v)=>{const t=el('div','s-tile',undefined,box);el('div','k',k,t);el('div','v',v,t)};
const W=D.weather||{},S=D.site||{};
function icon(s){s=String(s||'').replace(/_(day|night|polartwilight)$/,'');return/thunder/.test(s)?'⛈️':/snow/.test(s)?'❄️':/sleet/.test(s)?'🌨️':/rain/.test(s)?'🌧️':/fog/.test(s)?'🌫️':s==='clearsky'?'☀️':s==='fair'?'🌤️':s==='partlycloudy'?'⛅':s==='cloudy'?'☁️':'·'}
function render(){const t=$('tiles');t.textContent='';tile(t,'Temperature',F(W.temperature_c,1,'°C'));tile(t,'Humidity',F(W.humidity_percent,0,'%'));tile(t,'Dew point',F(W.dew_point_c,1,'°C'));tile(t,'Wind',F(W.wind_speed_mph,0,' mph')+' '+HWS.compass(W.wind_direction_deg));tile(t,'Gust',F(W.wind_gust_mph,0,' mph'));tile(t,'Pressure',F(W.pressure_hpa,1,' hPa'));tile(t,'Rain today',F(W.rain_today_mm,1,' mm'));tile(t,'UV / solar',F(W.uv_index,1)+' / '+F(W.solar_radiation_wm2,0));
const ts=Date.parse(W.updated||''),age=(Date.now()-ts)/60000;$('dot').className='s-dot'+(isFinite(age)&&age<=10?'':' off');$('status').textContent=isFinite(ts)?'Updated '+new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'No weather data'}
render();
const pts=(D.weather_series||[]).map(p=>[Date.parse(p.t),p.temperature_c]).filter(p=>has(p[1]));if(pts.length>1){const lo=Math.min(...pts.map(p=>p[1])),hi=Math.max(...pts.map(p=>p[1])),t0=pts[0][0],t1=pts[pts.length-1][0],r=(hi-lo)||1;$('spark').innerHTML='<svg viewBox="0 0 300 60" preserveAspectRatio="none" style="width:100%;height:70px"><polyline fill="none" stroke="#ffd166" stroke-width="2" points="'+pts.map(p=>((p[0]-t0)/(t1-t0||1)*300).toFixed(1)+','+(56-(p[1]-lo)/r*50).toFixed(1)).join(' ')+'"/></svg><div class="muted" style="display:flex;justify-content:space-between"><span>'+F(lo,1,'°C')+'</span><span>'+F(hi,1,'°C')+'</span></div>'}else $('spark').textContent='Not enough data yet';
const sm=D.sun_moon||{},sb=$('sun');for(const[k,v]of[['Sunrise',hm(sm.sunrise)],['Sunset',hm(sm.sunset)],['Moon',sm.moon?sm.moon.phase+' ('+Math.round(sm.moon.illumination_percent)+'%)':'–']]){const r=el('div','',undefined,sb);r.style.cssText='display:flex;justify-content:space-between';el('span','muted',k,r);el('b','',v,r)}
const fc=$('fc');for(const d of((D.forecast||{}).daily||[]).slice(0,6)){const e=el('div','',undefined,fc);el('div','muted',day(d.date).toLocaleDateString([],{weekday:'short'}),e);el('div','i',icon(d.symbol),e);el('div','',F(d.temp_max_c,0,'°')+' / '+F(d.temp_min_c,0,'°'),e)}if(!fc.children.length)fc.textContent='The forecast is not available yet.';
if((D.insights||[]).length){$('notes').hidden=false;for(const n of D.insights)el('li','',typeof n==='string'?n:(n.text||n.message||JSON.stringify(n)),$('notelist'))}
$('camnote').textContent=D.capture_time?'Captured '+D.capture_time:'';
for(const[h,l]of[['console.html','Live console'],['graphs.html','Graphs'],['webcam.html','Webcam and timelapse'],['radar.html','Rain radar'],['records.html','Records'],['reports.html','Reports'],['almanac.html','Almanac'],['about.html','About']]){const a=el('a','s-btn',l,$('links'));a.href=h}
function poll(){if(location.protocol==='file:'||document.hidden)return;fetch('weather-live.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(w=>{if(w&&typeof w==='object'){Object.assign(W,w);render()}}).catch(()=>{})}
setInterval(poll,30000);setInterval(()=>{const i=$('cam');if(i&&!i.hidden)i.src='latest.jpg?ts='+Date.now()},300000);
</script></div></body></html>
