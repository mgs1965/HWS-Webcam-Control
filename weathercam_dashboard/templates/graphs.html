<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harpenden Weather Station - Graphs</title>
<style>
:root{color-scheme:dark;--bg:#071827;--card:#0e273b;--line:#2a4960;--text:#edf6ff;--muted:#a9bdce;--blue:#4ea9ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Verdana,Geneva,sans-serif}.page{max-width:1300px;margin:auto;padding:16px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}h1{margin:0;font-size:24px}.muted{color:var(--muted)}a{color:var(--blue)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}.tabs button{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:7px 14px;font:inherit;cursor:pointer}.tabs button.on{background:#1766aa;border-color:#348acb}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:12px}@media(max-width:480px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.card h2{margin:0 0 4px;font-size:14px}.card .read{float:right;font-size:12px;color:var(--muted)}svg{width:100%;height:auto;display:block;touch-action:none}
</style></head><body><div class="page">
<header><h1>Harpenden Weather Station: graphs</h1><div class="muted">__NAV__</div></header>
<div class="tabs" role="tablist" id="tabs"></div><select class="s-btn" id="year" aria-label="Year" hidden></select><div class="muted" id="note" style="margin-bottom:8px"></div><div class="grid" id="grid"></div></div>
<script type="application/json" id="graph-data">__DATA__</script>
<script>
const raw=document.getElementById('graph-data').textContent.trim(),D=raw.startsWith('{')?JSON.parse(raw):{},G=D.graphs||{};
const has=v=>v!==null&&v!==undefined&&isFinite(Number(v)),NS='http://www.w3.org/2000/svg';
const PERIODS=[['24h','24h'],['7d','7d'],['month','Current month'],['day','Daily by year'],['year','Monthly by year']];
const CHARTS=[['Temperature','°C',[['temperature_c','#ffd166'],['dew_point_c','#4ea9ff']],1],['Humidity','%',[['humidity_percent','#4ea9ff']],0],['Pressure','hPa',[['pressure_hpa','#c9d1d9']],1],['Wind','mph',[['wind_speed_mph','#7bdff2'],['wind_gust_mph','#ff9f43']],0],['Rain','mm/h',[['rain_rate_mm_h','#4ea9ff']],1],['Rain today','mm',[['rain_today_mm','#4ea9ff']],1],['Solar radiation','W/m²',[['solar_radiation_wm2','#ff9f43']],0],['Ground temperature','°C',[['ground_temperature_c','#90be6d']],1],['Greenhouse soil wetness','cbar',[['soil_wetness_cbar','#43aa8b']],0],['Greenhouse soil temperature','°C',[['soil_temperature_c','#f8961e']],1],['Greenhouse temperature','°C',[['greenhouse_temperature_c','#ff9b85']],1]];
const YEAR=[['Daily rainfall','mm',[['rain_mm','#4ea9ff']],1],['Daily temperature','°C',[['temp_max_c','#ff6075'],['temp_min_c','#4ea9ff']],1],['Daily mean humidity','%',[['humidity_avg','#4ea9ff']],0],['Daily peak rain rate','mm/h',[['rain_max_mm_h','#4ea9ff']],1],['Daily wind','mph',[['wind_gust_mph','#ff9f4a'],['wind_avg_mph','#4ea9ff']],0],['Daily pressure','hPa',[['pressure_max_hpa','#ff6075'],['pressure_min_hpa','#4ea9ff']],0],['Daily dew point','°C',[['dew_max_c','#ff6075'],['dew_min_c','#4ea9ff']],1],['Daily humidity range','%',[['humidity_max','#ff6075'],['humidity_min','#4ea9ff']],0],['Daily sunshine','h',[['sunshine_hours','#ffd24a']],1],['Daily peak solar and UV','W/m² / UV',[['solar_max_wm2','#ffd24a'],['uv_max','#c77dff']],0],['Daily ground temperature','°C',[['ground_temp_avg_c','#90be6d']],1],['Daily soil wetness','cbar',[['soil_wetness_avg_cbar','#43aa8b']],0],['Daily soil temperature','°C',[['soil_temp_avg_c','#f8961e']],1],['Daily greenhouse temperature','°C',[['greenhouse_temp_avg_c','#ff9b85']],1]];
const MINSPAN={'Temperature':4,'Humidity':10,'Pressure':6,'Wind':5,'Rain':2,'Rain today':2,'Solar radiation':100,'Daily temperature':6,'Daily mean humidity':10,'Daily peak rain rate':2,'Daily rainfall':2},NONNEG=new Set(['Humidity','Wind','Rain','Rain today','Solar radiation','Daily mean humidity','Daily peak rain rate','Daily rainfall']);
function fmtT(t,period){const d=new Date(t);return period==='24h'?d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):period==='year'?d.toLocaleDateString([],{day:'numeric',month:'short'}):d.toLocaleDateString([],{day:'numeric',month:'short'})+' '+d.toLocaleTimeString([],{hour:'2-digit'})+'h'}
function chart(title,unit,series,digits,times,data,period){const card=document.createElement('section');card.className='card';const h=document.createElement('h2'),read=document.createElement('span');digits=HWS.digits(unit,digits);const rawUnit=unit;unit=HWS.label(unit);h.textContent=title+' ('+unit+')';read.className='read';h.append(read);card.append(h);
const lines=series.map(([k,c])=>({k,c,v:(data[k]||[]).map(x=>has(x)?HWS.conv(x,rawUnit):x)})).filter(s=>s.v.some(has));if(!lines.length||times.length<2){const p=document.createElement('p');p.className='muted';p.textContent='Not enough data yet';card.append(p);return card}
const vals=lines.flatMap(s=>s.v.filter(has).map(Number));let lo=Math.min(...vals),hi=Math.max(...vals);const span=Math.max(MINSPAN[title]||1,1e-6);if(hi-lo<span){const mid=(hi+lo)/2;lo=mid-span/2;hi=mid+span/2}const pad=(hi-lo)*.06;lo-=pad;hi+=pad;if(NONNEG.has(title)&&lo<0){hi-=lo;lo=0}
const W=420,H=170,L=42,R=8,T=8,B=22,pw=W-L-R,ph=H-T-B,ts=times.map(Date.parse),t0=ts[0],t1=ts[ts.length-1],X=t=>L+(t-t0)/(t1-t0||1)*pw,Y=v=>T+(1-(v-lo)/(hi-lo))*ph;
const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.setAttribute('role','img');svg.setAttribute('aria-label',title);
const mk=(tag,a,t)=>{const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;svg.append(e);return e};
for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3;mk('line',{x1:L,x2:W-R,y1:Y(v),y2:Y(v),stroke:'currentColor','stroke-opacity':'.15'});mk('text',{x:L-4,y:Y(v)+3,'text-anchor':'end','font-size':'10',fill:'currentColor','fill-opacity':'.7'},v.toFixed(digits))}
for(let i=0;i<=4;i++){const t=t0+(t1-t0)*i/4;mk('text',{x:X(t),y:H-6,'text-anchor':i===0?'start':i===4?'end':'middle','font-size':'10',fill:'currentColor','fill-opacity':'.7'},fmtT(t,period))}
for(const s of lines){let d='',pen=false;s.v.forEach((v,i)=>{if(!has(v)){pen=false;return}d+=(pen?'L':'M')+X(ts[i]).toFixed(1)+' '+Y(Number(v)).toFixed(1);pen=true});mk('path',{d,fill:'none',stroke:s.c,'stroke-width':'1.8','stroke-linejoin':'round'})}
const cross=mk('line',{y1:T,y2:T+ph,stroke:'currentColor','stroke-opacity':'.5',visibility:'hidden'});
const move=e=>{const r=svg.getBoundingClientRect(),x=((e.clientX-r.left)/r.width)*W,t=t0+Math.max(0,Math.min(1,(x-L)/pw))*(t1-t0);let best=0;for(let i=1;i<ts.length;i++)if(Math.abs(ts[i]-t)<Math.abs(ts[best]-t))best=i;cross.setAttribute('x1',X(ts[best]));cross.setAttribute('x2',X(ts[best]));cross.setAttribute('visibility','visible');read.textContent=fmtT(ts[best],period)+': '+lines.map(s=>has(s.v[best])?Number(s.v[best]).toFixed(digits):'–').join(' / ')+' '+unit};
svg.addEventListener('pointermove',move);svg.addEventListener('pointerleave',()=>{cross.setAttribute('visibility','hidden');read.textContent=''});card.append(svg);
if(lines.length>1){const key=document.createElement('div');key.className='muted';key.style.fontSize='12px';key.textContent=lines.map(s=>s.k.replace(/_c$|_mph$|_percent$/,'').replace(/_/g,' ')).join(' / ');card.append(key)}return card}
const year=document.getElementById('year');let active='24h';for(const y of [...new Set((G.daily||[]).map(r=>r.date.slice(0,4)))].sort().reverse()){const o=document.createElement('option');o.value=o.textContent=y;year.append(o)}year.onchange=()=>show(active);
function show(period){active=period;const grid=document.getElementById('grid');grid.textContent='';year.hidden=period!=='day'&&period!=='year';for(const b of document.querySelectorAll('#tabs button'))b.classList.toggle('on',b.dataset.p===period);
if(period==='day'||period==='year'){const days=(G.daily||[]).filter(r=>r.date.startsWith(year.value));const keys=[...new Set(YEAR.flatMap(y=>y[2].map(s=>s[0])))],data={};let times;
if(period==='day'){times=days.map(x=>x.date+'T12:00:00');for(const k of keys)data[k]=days.map(d=>d[k]);}
else{times=Array.from({length:12},(_,i)=>year.value+'-'+String(i+1).padStart(2,'0')+'-15T12:00:00');for(const k of keys)data[k]=times.map((_,i)=>{const vals=days.filter(r=>Number(r.date.slice(5,7))===i+1&&has(r[k])).map(r=>Number(r[k]));if(!vals.length)return null;if(k==='rain_mm'||k==='sunshine_hours')return vals.reduce((a,b)=>a+b,0);if(k.includes('_max')||k==='wind_gust_mph'||k==='rain_max_mm_h')return Math.max(...vals);if(k.includes('_min'))return Math.min(...vals);return vals.reduce((a,b)=>a+b,0)/vals.length;});}
document.getElementById('note').textContent=days.length+' recorded days in '+(year.value||'the selected year')+(period==='year'?'. Monthly totals, extremes and averages use available days only.':'.');
for(const[t,u,s,d]of YEAR)grid.append(chart(period==='year'?t.replace('Daily','Monthly'):t,u,s,d,times,data,'year'));return}
const data=G[period]||{t:[]};document.getElementById('note').textContent=period==='24h'?'Five-minute averages from the weather station.':period==='7d'?'Hourly averages (from the camera scene log).':'Current calendar month: three-hourly averages (from the camera scene log).';for(const[t,u,s,d]of CHARTS)grid.append(chart(t,u,s,d,data.t||[],data,period))}
const tabs=document.getElementById('tabs');for(const[p,l]of PERIODS){const b=document.createElement('button');b.textContent=l;b.dataset.p=p;b.addEventListener('click',()=>{show(p);if(location.protocol!=='file:')history.replaceState(null,'','#'+p)});tabs.append(b)}
HWS.csvButton(tabs,'Download CSV','hws-graph-data.csv',()=>{if(active==='day'||active==='year'){const days=(G.daily||[]).filter(r=>r.date.startsWith(year.value)),cols=[...new Set(days.flatMap(r=>Object.keys(r)))].filter(k=>k!=='date');return{header:['date'].concat(cols),rows:days.map(r=>[r.date].concat(cols.map(k=>r[k])))}}
const d=G[active]||{t:[]},cols=Object.keys(d).filter(k=>k!=='t'&&Array.isArray(d[k]));return{header:['time'].concat(cols),rows:(d.t||[]).map((t,i)=>[t].concat(cols.map(k=>d[k][i])))}});
const start=location.hash.slice(1);show(PERIODS.some(p=>p[0]===start)?start:'24h');
</script></body></html>
