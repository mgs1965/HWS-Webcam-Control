<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harpenden Weather Station</title>
<style>
:root{color-scheme:dark;--bg:#071827;--card:#0e273b;--line:#2a4960;--text:#edf6ff;--muted:#a9bdce;--blue:#4ea9ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Verdana,Geneva,sans-serif}.page{max-width:900px;margin:auto;padding:16px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}h1{margin:0;font-size:24px}.muted{color:var(--muted)}a{color:var(--blue)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}table{border-collapse:collapse;width:100%}th,td{padding:7px 4px;text-align:left;border-bottom:1px solid #203e53;vertical-align:top}th{color:var(--muted);font-weight:600;width:38%}tr:last-child th,tr:last-child td{border:0}
</style></head><body><div class="page">
<header><h1 id="title"></h1><div class="muted">__NAV__</div></header>
<div class="card" id="main"></div><div class="card" id="links" hidden><strong>Links</strong><ul id="list"></ul></div>
<script type="application/json" id="data">__DATA__</script>
<script>
const raw=document.getElementById('data').textContent.trim(),D=raw.startsWith('{')?JSON.parse(raw):{},S=D.site||{},main=document.getElementById('main');
function station(){const heading=document.createElement('h2');heading.textContent='The Station';main.append(heading);const t=document.createElement('table');for(const[k,v]of Object.entries(S.station||{})){const r=t.insertRow(),h=document.createElement('th');h.textContent=k;r.append(h);r.insertCell().textContent=v}
const lat=Number(S.latitude),lon=Number(S.longitude);if(isFinite(lat)&&isFinite(lon)){const r=t.insertRow(),h=document.createElement('th');h.textContent='Coordinates';r.append(h);const c=r.insertCell(),a=document.createElement('a');a.href='https://www.openstreetmap.org/?mlat='+lat+'&mlon='+lon+'#map=13/'+lat+'/'+lon;a.textContent=lat.toFixed(4)+', '+lon.toFixed(4);a.rel='noopener';c.append(a)}
main.append(t)}
for(const p of S.about||[]){const e=document.createElement('p');e.textContent=p;main.append(e)}
const tag=document.createElement('p');tag.className='muted';tag.textContent=S.tagline||'';main.append(tag);station();
if(S.donate){const h=document.createElement('h2');h.textContent='Support The Station';const e=document.createElement('p');e.textContent=S.donate;main.append(h,e)}
if((S.links||[]).length){document.getElementById('links').hidden=false;for(const l of S.links){if(!l||typeof l.url!=='string'||!/^https?:\/\//.test(l.url))continue;const li=document.createElement('li'),a=document.createElement('a');a.href=l.url;a.rel='noopener';a.textContent=l.title||l.url;li.append(a);document.getElementById('list').append(li)}}
</script></div></body></html>
