<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compare periods</title>
<style>:root{color-scheme:dark;--bg:#071827;--card:#0e273b;--line:#2a4960;--text:#edf6ff;--muted:#a9bdce;--blue:#4ea9ff;--amber:#ffd166;--green:#4bd66a;--red:#ff6075}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,"Segoe UI",sans-serif}a{color:var(--blue)}.muted{color:var(--muted)}</style></head><body><div class="s-page">
<header class="s-head"><h1>Compare periods</h1><div class="s-nav muted">__NAV__</div></header>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><select id="a" class="s-btn" aria-label="Period A"></select><span class="muted" style="align-self:center">against</span><select id="b" class="s-btn" aria-label="Period B"></select></div>
<div class="s-card"><h2>Summary</h2><table class="s-table" id="sum"></table></div>
<div class="s-card"><h2>Daily high temperature (°C)</h2><div id="ct"></div></div>
<div class="s-card"><h2>Cumulative rainfall (mm)</h2><div id="cr"></div></div>
<script type="application/json" id="data">__DATA__</script>
<script>
const raw=document.getElementById('data').textContent.trim(),D=raw.startsWith('{')?JSON.parse(raw):{},$=id=>document.getElementById(id),has=v=>v!==null&&v!==undefined&&v!==''&&isFinite(Number(v));
const el=(tag,cls,text,parent)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;if(parent)parent.append(e);return e};
const F=(v,d,u,delta)=>HWS.fmt(v,d,u,delta),rows=(D.daily||[]).filter(r=>r.date),COL=['#ffd166','#4ea9ff'];
const periods=[...new Set(rows.flatMap(r=>[r.date.slice(0,4),r.date.slice(0,7)]))].sort().reverse();
for(const id of['a','b'])for(const p of periods){const o=el('option','',p.length===4?p+' (whole year)':p,$(id));o.value=p}
const cur=new Date().toISOString().slice(0,7),prev=(+cur.slice(0,4)-1)+cur.slice(4);$('a').value=periods.includes(cur)?cur:periods[0];$('b').value=periods.includes(prev)?prev:(periods[1]||periods[0]);
const pick=p=>rows.filter(r=>r.date.startsWith(p)).sort((x,y)=>x.date<y.date?-1:1),idx=(r,p)=>p.length===4?Math.floor((Date.parse(r.date)-Date.parse(p+'-01-01'))/864e5):+r.date.slice(8,10)-1;
function lines(box,sets,fn,unit,dig){box.textContent='';const w=700,h=190,pad=34,n=Math.max(...sets.map(s=>s.len),1);let all=[];sets.forEach(s=>all.push(...s.pts.map(p=>p[1])));if(!all.length){el('p','muted','No data for these periods',box);return}
 const lo=Math.min(...all,fn==='sum'?0:Infinity),hi=Math.max(...all),r=(hi-lo)||1;let s='<svg viewBox="0 0 '+w+' '+(h+18)+'" style="width:100%;height:auto"><text x="0" y="12" fill="#a9bdce" font-size="11">'+F(hi,dig,unit)+'</text><text x="0" y="'+h+'" fill="#a9bdce" font-size="11">'+F(lo,dig,unit)+'</text><line x1="'+pad+'" x2="'+w+'" y1="'+h+'" y2="'+h+'" stroke="#2a4960"/>';
 sets.forEach((st,i)=>{if(st.pts.length)s+='<polyline fill="none" stroke="'+COL[i]+'" stroke-width="2" points="'+st.pts.map(p=>(pad+p[0]/Math.max(n-1,1)*(w-pad)).toFixed(1)+','+(h-(p[1]-lo)/r*(h-18)).toFixed(1)).join(' ')+'"/>'});
 box.insertAdjacentHTML('beforeend',s+'</svg><p class="muted">'+sets.map((st,i)=>'<span style="color:'+COL[i]+'">&#9632; '+st.name+'</span>').join(' &nbsp; ')+'</p>')}
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function draw(){const P=[$('a').value,$('b').value],S=P.map(pick);
 lines($('ct'),S.map((d,i)=>({name:P[i],len:P[i].length===4?366:31,pts:d.filter(r=>has(r.temp_max_c)).map(r=>[idx(r,P[i]),+r.temp_max_c])})),'avg','°C',1);
 lines($('cr'),S.map((d,i)=>{let c=0;return{name:P[i],len:P[i].length===4?366:31,pts:d.filter(r=>has(r.rain_mm)).map(r=>{c+=+r.rain_mm;return[idx(r,P[i]),c]})}}),'sum',' mm',0);
 const t=$('sum');t.textContent='';const h=t.insertRow();el('th','','',h);P.forEach(p=>el('th','',p,h));
 const add=(l,f)=>{const r=t.insertRow();r.insertCell().textContent=l;S.forEach(d=>r.insertCell().textContent=f(d))};
 add('Days with data',d=>d.length);add('Average high',d=>F(avg(d.filter(r=>has(r.temp_max_c)).map(r=>+r.temp_max_c)),1,'°C'));add('Average low',d=>F(avg(d.filter(r=>has(r.temp_min_c)).map(r=>+r.temp_min_c)),1,'°C'));
 add('Hottest',d=>{const v=d.filter(r=>has(r.temp_max_c)).map(r=>+r.temp_max_c);return v.length?F(Math.max(...v),1,'°C'):'–'});add('Coldest',d=>{const v=d.filter(r=>has(r.temp_min_c)).map(r=>+r.temp_min_c);return v.length?F(Math.min(...v),1,'°C'):'–'});
 add('Total rain',d=>F(d.reduce((s,r)=>s+(has(r.rain_mm)?+r.rain_mm:0),0),1,' mm'));add('Rain days (0.2 mm+)',d=>d.filter(r=>has(r.rain_mm)&&r.rain_mm>=0.2).length)}
$('a').onchange=$('b').onchange=draw;draw();
</script></div></body></html>
