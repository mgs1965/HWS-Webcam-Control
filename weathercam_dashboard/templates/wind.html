<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wind</title>
<style>:root{color-scheme:dark;--bg:#071827;--card:#0e273b;--line:#2a4960;--text:#edf6ff;--muted:#a9bdce;--blue:#4ea9ff;--amber:#ffd166;--green:#4bd66a;--red:#ff6075}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,"Segoe UI",sans-serif}a{color:var(--blue)}.muted{color:var(--muted)}</style></head><body><div class="s-page">
<header class="s-head"><h1>Wind</h1><div class="s-nav muted">__NAV__</div></header>
<div class="s-tiles" id="tiles"></div>
<div class="s-tabs" id="tabs"></div>
<div class="s-card"><h2 id="rt">Wind rose</h2><div id="rose" style="max-width:420px;margin:auto"></div><p class="muted" id="rn"></p><div id="key" class="muted"></div></div>
<script type="application/json" id="data">__DATA__</script>
<script>
const raw=document.getElementById('data').textContent.trim(),D=raw.startsWith('{')?JSON.parse(raw):{},$=id=>document.getElementById(id),has=v=>v!==null&&v!==undefined&&v!==''&&isFinite(Number(v));
const el=(tag,cls,text,parent)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;if(parent)parent.append(e);return e};
const F=(v,d,u,delta)=>HWS.fmt(v,d,u,delta),NS='http://www.w3.org/2000/svg';
const tile=(box,k,v)=>{const t=el('div','s-tile',undefined,box);el('div','k',k,t);el('div','v',v,t)};
function bars(box,rows,color,unit,dig){/* rows: [label,value] */const w=700,h=190,pad=30,n=rows.length;if(!n){el('p','muted','No data yet',box);return}const mx=Math.max(...rows.map(r=>r[1]),0.1),bw=(w-pad)/n;let s='<svg viewBox="0 0 '+w+' '+(h+22)+'" style="width:100%;height:auto"><text x="0" y="12" fill="#a9bdce" font-size="11">'+F(mx,dig,unit)+'</text><line x1="'+pad+'" x2="'+w+'" y1="'+h+'" y2="'+h+'" stroke="#2a4960"/>';rows.forEach((r,i)=>{const bh=Math.max(r[1]/mx*(h-18),r[1]>0?1:0),x=pad+i*bw;s+='<rect x="'+(x+1).toFixed(1)+'" y="'+(h-bh).toFixed(1)+'" width="'+Math.max(bw-2,1).toFixed(1)+'" height="'+bh.toFixed(1)+'" fill="'+color+'"><title>'+r[0]+': '+F(r[1],dig,unit)+'</title></rect>';if(n<=14||i%Math.ceil(n/8)===0)s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(h+15)+'" fill="#a9bdce" font-size="10" text-anchor="middle">'+r[0]+'</text>'});box.insertAdjacentHTML('beforeend',s+'</svg>')}

const W=D.weather||{},R=D.rose||{},T=$('tiles'),COL=['#4ea9ff','#4bd66a','#ffd166','#ff6075'],LAB=['0.5–5','5–10','10–20','20+'];
tile(T,'Wind',F(W.wind_speed_mph,0,' mph')+' '+HWS.compass(W.wind_direction_deg));tile(T,'Gust',F(W.wind_gust_mph,0,' mph'));
function draw(k){const r=R[k],b=$('rose');b.textContent='';$('rt').textContent='Wind rose, '+({'24h':'last 24 hours','7d':'last 7 days','30d':'last 30 days'}[k]);
 if(!r){b.textContent='Not enough wind samples yet. The 7 and 30 day roses build up as the camera records wind direction.';$('rn').textContent='';return}
 const c=150,max=Math.max(...r.percent.map(x=>x.reduce((a,v)=>a+v,0)),1),sc=120/max;let s='<svg viewBox="0 0 300 300" style="width:100%">';
 for(const f of[.5,1]){s+='<circle cx="150" cy="150" r="'+(120*f)+'" fill="none" stroke="#2a4960"/>'}
 ['N','E','S','W'].forEach((l,i)=>{const a=i*Math.PI/2;s+='<text x="'+(150+138*Math.sin(a))+'" y="'+(154-138*Math.cos(a))+'" fill="#a9bdce" font-size="12" text-anchor="middle">'+l+'</text>'});
 r.percent.forEach((row,i)=>{let inner=0;const a0=(i*22.5-9)*Math.PI/180,a1=(i*22.5+9)*Math.PI/180;row.forEach((v,j)=>{const o=inner+v*sc;if(v>0){const p=(rr,a)=>(c+rr*Math.sin(a)).toFixed(1)+','+(c-rr*Math.cos(a)).toFixed(1);s+='<path fill="'+COL[j]+'" d="M'+p(inner,a0)+' L'+p(o,a0)+' A'+o+','+o+' 0 0 1 '+p(o,a1)+' L'+p(inner,a1)+' A'+inner+','+inner+' 0 0 0 '+p(inner,a0)+'Z"/>'}inner=o})});
 b.innerHTML=s+'</svg><p class="muted" style="margin:4px 0 0;font-size:12px">'+COL.map((c,j)=>'<span style="color:'+c+'">&#9632;</span> '+LAB[j]+' '+HWS.label('mph').trim()).join(' &nbsp; ')+' &nbsp; (rings: '+F(max/2,0,'%')+', '+F(max,0,'%')+' of time)</p>';$('rn').textContent=r.samples+' samples, calm '+r.calm_percent+'% of the time. Petals show where the wind blows from; rings are '+F(max/2,0,'%')+' and '+F(max,0,'%')+'.';
 $('key').innerHTML=LAB.map((l,i)=>'<span style="color:'+COL[i]+'">&#9632;</span> '+l+' mph').join(' &nbsp; ')}
for(const[k,l]of[['24h','24 hours'],['7d','7 days'],['30d','30 days']]){const a=el('button','s-btn',l,$('tabs'));a.onclick=()=>draw(k)}
draw(R['24h']?'24h':R['7d']?'7d':'30d');
</script></div></body></html>
