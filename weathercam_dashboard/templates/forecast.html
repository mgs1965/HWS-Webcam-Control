<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harpenden Weather Station - Forecast</title>
<style>
:root{color-scheme:dark;--bg:#071827;--card:#0e273b;--line:#2a4960;--text:#edf6ff;--muted:#a9bdce;--blue:#4ea9ff;--amber:#ffd166}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Verdana,Geneva,sans-serif}.page{max-width:1300px;margin:auto;padding:16px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}h1{margin:0;font-size:24px}h2{font-size:15px;margin:18px 0 8px}.muted{color:var(--muted)}a{color:var(--blue)}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.day .ico{font-size:34px}.day .d{font-weight:600}.day .hi{color:var(--amber);font-weight:600}.day .lo{color:var(--blue)}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:560px}th,td{padding:6px 10px;text-align:right;border-bottom:1px solid #203e53;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-weight:600;font-size:13px}
.banner{background:#4a2a10;border:1px solid var(--amber);border-radius:10px;padding:10px 14px;margin-bottom:12px}
</style></head><body><div class="page">
<header><h1>Harpenden Weather Station: forecast</h1><div class="muted">__NAV__</div></header>
<div id="stale" class="banner" hidden></div><div id="none" class="banner" hidden>The forecast is not available at the moment. It is fetched from the internet by the camera computer and will appear on the next refresh.</div>
<div id="body"><h2>Next days</h2><div class="days" id="days"></div><h2>Next 48 hours</h2><div class="wrap"><table id="hours"></table></div></div>
<p class="muted" id="credit" style="margin-top:14px"></p></div>
<script type="application/json" id="data">__DATA__</script>
<script>
const raw=document.getElementById('data').textContent.trim(),D=raw.startsWith('{')?JSON.parse(raw):{},F=D.forecast;
const has=v=>v!==null&&v!==undefined&&isFinite(Number(v)),NAMES=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'],compass=d=>has(d)?NAMES[Math.round((((Number(d)%360)+360)%360)/22.5)%16]:'–';
function icon(s){s=String(s||'');const n=/_night$/.test(s);s=s.replace(/_(day|night|polartwilight)$/,'');if(/thunder/.test(s))return'⛈️';if(/snow/.test(s))return'❄️';if(/sleet/.test(s))return'🌨️';if(/^heavyrain/.test(s))return'🌧️';if(/rain/.test(s))return/^light/.test(s)?'🌦️':'🌧️';if(/fog/.test(s))return'🌫️';if(s==='clearsky')return n?'🌙':'☀️';if(s==='fair')return n?'🌙':'🌤️';if(s==='partlycloudy')return'⛅';if(s==='cloudy')return'☁️';return'·'}
const fmt=(v,d=0,u='')=>HWS.fmt(v,d,u);
if(!F||!F.hourly||!F.hourly.length){document.getElementById('none').hidden=false;document.getElementById('body').hidden=true}else{
if(F.stale){const b=document.getElementById('stale');b.hidden=false;b.textContent='The forecast could not be refreshed and may be out of date.'}
const days=document.getElementById('days');for(const d of(F.daily||[]).slice(0,8)){const e=document.createElement('div');e.className='day';const dt=new Date(d.date+'T12:00:00');e.innerHTML='<div class="d"></div><div class="ico"></div><div><span class="hi"></span> / <span class="lo"></span></div><div class="muted r"></div><div class="muted w"></div>';e.querySelector('.d').textContent=dt.toLocaleDateString([],{weekday:'short',day:'numeric',month:'short'});e.querySelector('.ico').textContent=icon(d.symbol);e.querySelector('.hi').textContent=fmt(d.temp_max_c,0,'°');e.querySelector('.lo').textContent=fmt(d.temp_min_c,0,'°');e.querySelector('.r').textContent=has(d.rain_mm)?fmt(d.rain_mm,1,' mm'):'';e.querySelector('.w').textContent=has(d.wind_max_mph)?'wind to '+fmt(d.wind_max_mph,0,' mph'):'';days.append(e)}
const t=document.getElementById('hours'),rows=F.hourly.filter(h=>Date.parse(h.t)>=Date.now()-36e5&&Date.parse(h.t)<=Date.now()+48*36e5).filter((h,i)=>i%3===0||h.hours>1);
t.innerHTML='<tr><th>Time</th><th></th><th>Temp</th><th>Rain</th><th>Wind</th><th>Cloud</th><th>Humidity</th><th>Pressure</th></tr>';
for(const h of rows){const r=t.insertRow();const c=[new Date(h.t).toLocaleString([],{weekday:'short',hour:'2-digit',minute:'2-digit'}),icon(h.symbol),fmt(h.temperature_c,1,'°C'),has(h.rain_mm)?fmt(h.rain_mm,1,' mm'):'–',fmt(h.wind_mph,0,' mph')+' '+compass(h.wind_direction_deg),fmt(h.cloud_pct,0,'%'),fmt(h.humidity_percent,0,'%'),fmt(h.pressure_hpa,0,' hPa')];c.forEach(x=>{r.insertCell().textContent=x})}
document.getElementById('credit').textContent='Forecast data from '+(F.source||'MET Norway')+', the service behind yr.no. Fetched '+new Date(F.fetched).toLocaleString()+'. Rain is the amount in the following hour (or six hours where no hourly data exists).'}
</script></body></html>
