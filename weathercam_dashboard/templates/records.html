<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather records</title>
</head><body class="s-base"><div class="s-page">
<header class="s-head"><h1>Weather records</h1><div class="s-nav muted">__NAV__</div></header>
<p class="muted" id="intro"></p><div class="s-grid records-grid" id="grid"></div><div class="s-card" id="yr" hidden><h2>Year to date (from the Meteobridge)</h2><div id="yrbody"></div></div>
<script type="application/json" id="data">__DATA__</script>
<script>
const {D,$,has,el,tile}=HWS.page();
const F=(v,d,u,delta)=>HWS.fmt(v,d,u,delta),day=s=>new Date(s+'T12:00:00'),hm=s=>s?new Date(s).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'–';
const R=D.records||{},SCOPES=[['month','This month'],['year','This year'],['all','All stored days']];
const ROWS=[['hottest_c','Hottest day','°C',1],['coldest_c','Coldest night','°C',1],['wettest_mm','Wettest day','mm',1],['gust_mph','Strongest gust','mph',0],['pressure_high_hpa','Highest pressure','hPa',1],['pressure_low_hpa','Lowest pressure','hPa',1]];
for(const[k,l]of SCOPES){const r=R[k]||{},c=el('section','s-card',undefined,$('grid'));el('h2','',l+' ('+(r.days||0)+' days)',c);const t=el('table','s-table',undefined,c);
 const add=(a,b,d)=>{const row=t.insertRow();row.insertCell().textContent=a;row.insertCell().textContent=b;row.insertCell().textContent=d||''};
 for(const[key,label,unit,dg]of ROWS)if(r[key])add(label,F(r[key].value,dg,' '+unit),r[key].date);
 if(r.rain_total_mm!==undefined){add('Total rain',F(r.rain_total_mm,1,' mm'));add('Rain days (0.2 mm+)',String(r.rain_days))}
 if(!t.rows.length)el('p','muted','No data yet',c)}
$('intro').textContent='Records come from the daily values stored by the dashboard'+(R.all&&R.all.first?' since '+R.all.first:'')+'. Import older Meteobridge history with weather_station.py --backfill to extend them.';
HWS.csvButton($('intro'),'Download CSV','hws-records.csv',()=>{const rows=[];for(const[k,l]of SCOPES){const r=R[k]||{};for(const[key,label,unit]of ROWS)if(r[key])rows.push([l,label,r[key].value,unit,r[key].date]);if(r.rain_total_mm!==undefined)rows.push([l,'Total rain',r.rain_total_mm,'mm','']),rows.push([l,'Rain days (0.2 mm+)',r.rain_days,'days',''])}return{header:['scope','record','value','unit','date'],rows}});
if((D.legacy||[]).length){const c=el('section','s-card',undefined,$('grid'));el('h2','','Earlier records (from the old site)',c);const t=el('table','s-table',undefined,c);for(const r of D.legacy){const x=t.insertRow();x.insertCell().textContent=r.label;x.insertCell().textContent=F(r.value,1,' '+r.unit);x.insertCell().textContent=r.date}}
const Y=D.year_records;if(Y&&Object.keys(Y).length){$('yr').hidden=false;const t=el('table','s-table',undefined,$('yrbody'));for(const[k,l,u]of[['temp_max_c','Hottest','°C'],['temp_min_c','Coldest','°C'],['pressure_max_hpa','Highest pressure','hPa'],['pressure_min_hpa','Lowest pressure','hPa']])if(Y[k]){const r=t.insertRow();r.insertCell().textContent=l;r.insertCell().textContent=F(Y[k].value,1,' '+u);r.insertCell().textContent=String(Y[k].when||'').slice(0,10)}}
</script></div></body></html>
