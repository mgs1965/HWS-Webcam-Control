<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meteobridge health</title>
</head><body class="s-base"><div class="s-page">
<header class="s-head"><h1>Meteobridge health</h1><div class="s-nav muted">__NAV__</div></header>
<div class="s-grid" id="grid"></div>
<script type="application/json" id="data">__DATA__</script>
<script>
const {D,$,has,el,tile}=HWS.page();
const F=(v,d,u,delta)=>HWS.fmt(v,d,u,delta),NS='http://www.w3.org/2000/svg';

const H=D.health||{},W=D.weather||{},ICON={ok:'✅',warn:'⚠️',bad:'❌',unknown:'❔'};
let c=el('section','s-card',undefined,$('grid'));el('h2','',"Checks",c);
for(const k of H.checks||[]){const r=el('div','',undefined,c);r.style.cssText='display:flex;justify-content:space-between;gap:8px;padding:4px 0';el('span','',(ICON[k.status]||'')+' '+k.name,r);el('span','muted',k.detail,r)}
c=el('section','s-card',undefined,$('grid'));el('h2','',"History",c);const t=el('table','s-table',undefined,c);
for(const[a,b]of[['Days stored',H.days_stored],['First stored day',H.first_day],['Archive days (Meteobridge import)',H.archive_days],['Archive from',H.archive_first],['Archive to',H.archive_last],['Missing in last 30 days',(H.gaps||[]).join(', ')||'none']]){const r=t.insertRow();r.insertCell().textContent=a;r.insertCell().textContent=b??'–'}
c=el('section','s-card',undefined,$('grid'));el('h2','',"Source",c);const t2=el('table','s-table',undefined,c);
const stamp=Date.parse(W.updated||''),updated=Number.isFinite(stamp)?new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(stamp)).replace(',',''):null;
for(const[a,b]of[['Source',W.source],['Updated',updated],['Bridge data age (s)',W.bridge_data_age_s],['Station note',H.station_message]]){if(b===null||b===undefined||String(b).trim()==='')continue;const r=t2.insertRow();r.insertCell().textContent=a;r.insertCell().textContent=b}
if(!t2.rows.length)el('p','muted','No source information available.',c);
c=el('section','s-card s-card-wide',undefined,$('grid'));el('h2','',"Meteobridge data",c);
const tiles=el('div','s-tiles',undefined,c);
tile(tiles,'CPU load',has(W.cpu_load_percent)?F(W.cpu_load_percent,1,'%'):'–');
tile(tiles,'Uptime',F(W.bridge_uptime_hours,1,' hours'));
tile(tiles,'Storage usage',has(W.storage_usage_percent)?F(W.storage_usage_percent,1,'%'):'–');
tile(tiles,'RAM usage',has(W.ram_usage_percent)?F(W.ram_usage_percent,1,'%'):'–');
tile(tiles,'Power consumption',has(W.power_consumption_w)?F(W.power_consumption_w,2,' W'):'–');
tile(tiles,'Processes',has(W.process_count)?String(Math.round(W.process_count)):'–');
tile(tiles,'Data age',has(W.bridge_data_age_s)?F(W.bridge_data_age_s,0,' s'):'–');
tile(tiles,'Voltage',has(W.voltage_v)?F(W.voltage_v,2,' V'):'–');
tile(tiles,'Current',has(W.current_a)?F(W.current_a,3,' A'):'–');
tile(tiles,'Signal minimum (5 min)',F(W.signal_min,0,' dB'));
tile(tiles,'Signal maximum (5 min)',F(W.signal_max,0,' dB'));
tile(tiles,'Base board temperature',F(W.base_board_temperature_c,1,' °C'));
tile(tiles,'RF board temperature',F(W.rf_board_temperature_c,1,' °C'));

c=el('section','s-card s-card-wide',undefined,$('grid'));el('h2','',"Health trends",c);
const tabs=el('div','s-tabs',undefined,c),year=el('select','s-btn',undefined,c),note=el('p','muted','',c),chart=el('div','s-grid',undefined,c);chart.style.marginTop='12px';
year.setAttribute('aria-label','History year');year.hidden=true;
const specs=[['CPU load','cpu_load_percent','%', '#ff6075'],['Uptime','bridge_uptime_hours','h','#4ea9ff'],['Storage usage','storage_usage_percent','%','#ffd166'],['RAM usage','ram_usage_percent','%','#43aa8b'],['Power consumption','power_consumption_w','W','#ff9f43'],['Processes','process_count','','#c77dff'],['Data age','bridge_data_age_s','s','#a9bdc9'],['Voltage','voltage_v','V','#4ea9ff'],['Current','current_a','A','#ff6075'],['Base board temperature','base_board_temperature_c','°C','#f8961e'],['RF board temperature','rf_board_temperature_c','°C','#ff9b85']];
const historyMap={
 cpu_load_percent:'cpu_load_avg',bridge_uptime_hours:'uptime_last',
 storage_usage_percent:'storage_usage_avg',ram_usage_percent:'ram_usage_avg',
 power_consumption_w:'power_consumption_avg',process_count:'process_count_avg',
 bridge_data_age_s:'data_age_avg',voltage_v:'voltage_avg',current_a:'current_avg',
 base_board_temperature_c:'base_board_temp_avg_c',rf_board_temperature_c:'rf_board_temp_avg_c',
 signal_min:'signal_min',signal_max:'signal_max'};
const history=(D.graphs?.daily||[]).filter(r=>/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')&&Object.values(historyMap).some(k=>has(r[k]))).sort((a,b)=>a.date.localeCompare(b.date));
for(const y of [...new Set(history.map(r=>r.date.slice(0,4)))].sort().reverse()){const o=el('option','',y,year);o.value=y}

function lineChart(box,list,unit,dig,xfmt){const all=list.flatMap(s=>s.pts),vs=all.map(p=>p[1]),lo0=Math.min(...vs),hi0=Math.max(...vs),padv=((hi0-lo0)||1)*.1,lo=lo0-padv,hi=hi0+padv,t0=Math.min(...all.map(p=>p[0])),t1=Math.max(...all.map(p=>p[0])),L=38,W=300,H=100,X=t=>L+(t-t0)/(t1-t0||1)*(W-L),Y=v=>H-(v-lo)/(hi-lo)*H,fm=v=>Math.abs(hi-lo)>=5?Math.round(v):v.toFixed(Math.max(dig,1));
 let s='<svg viewBox="0 0 '+(W+4)+' '+(H+18)+'" style="width:100%;height:auto;font-size:8px" fill="#a9bdce">';
 for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3,y=Y(v);s+='<line x1="'+L+'" x2="'+W+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="#2a4960" stroke-width=".5"/><text x="'+(L-3)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end">'+fm(v)+'</text>'}
 for(let i=0;i<=4;i++){const t=t0+(t1-t0)*i/4;s+='<text x="'+X(t).toFixed(1)+'" y="'+(H+12)+'" text-anchor="'+(i===0?'start':i===4?'end':'middle')+'">'+xfmt(t)+'</text>'}
 for(const se of list)s+='<polyline fill="none" stroke="'+se.color+'" stroke-width="1.5" stroke-linejoin="round" points="'+se.pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')+'"/>';
 box.insertAdjacentHTML('beforeend',s+'</svg>');const last=list[0].pts[list[0].pts.length-1][1];el('div','muted','Min '+fm(lo0)+' · max '+fm(hi0)+(list.length===1?' · now '+fm(last):''),box)}
let activePeriod='24h';
function renderPeriod(period){
 activePeriod=period;
 chart.textContent='';
 const G=D.graphs||{};
 let series=G[period]||G['24h']||{t:[]};
 year.hidden=period!=='daily'&&period!=='monthly';
 note.textContent='';
 const fallback=new Set((G[period]?.daily_fallback_fields||'').split(','));
 if((period==='7d'||period==='month')&&(specs.some(([,key])=>fallback.has(key))||fallback.has('signal_min')||fallback.has('signal_max')))note.textContent='Daily summaries are used for graph series without detailed samples.';
 if(!year.hidden){
  const daily=history.filter(r=>r.date.slice(0,4)===year.value);
  note.textContent=daily.length+' recorded days with health readings in '+(year.value||'the selected year')+'. '+(period==='monthly'?'Monthly averages use available daily values; uptime is the last reading and signal shows extrema.':'Only available daily readings are shown.');
  if(period==='daily'){
   series={t:daily.map(r=>r.date+'T12:00:00Z')};
   for(const[key,field]of Object.entries(historyMap))series[key]=daily.map(r=>r[field]);
  }else{
   const months=Array.from({length:12},(_,i)=>daily.filter(r=>Number(r.date.slice(5,7))===i+1));
   series={t:months.map((_,i)=>year.value+'-'+String(i+1).padStart(2,'0')+'-15T12:00:00Z')};
   for(const[key,field]of Object.entries(historyMap))series[key]=months.map(rows=>{
    const values=rows.map(r=>r[field]).filter(has).map(Number);
    if(!values.length)return null;
    if(key==='signal_min')return Math.min(...values);
    if(key==='signal_max')return Math.max(...values);
    if(key==='bridge_uptime_hours')return values[values.length-1];
    return values.reduce((a,b)=>a+b,0)/values.length;
   });
  }
 }
 for(const[name,key,unit,color]of specs){
  const pts=(series.t||[]).map((t,i)=>[Date.parse(t),series[key]?.[i]]).filter(p=>Number.isFinite(p[0])&&has(p[1]));
  if(!pts.length)continue;
  const box=el('section','s-card',undefined,chart);el('h2','',name+(unit?' ('+unit+')':''),box);
  lineChart(box,[{name,color,pts}],unit,key==='bridge_uptime_hours'||key==='bridge_data_age_s'||key==='process_count'?0:key==='current_a'?3:1,t=>period==='24h'?new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):new Date(t).toLocaleDateString([],{day:'numeric',month:'short'}));
 }
  const signal=[['Minimum','signal_min','#ff6075'],['Maximum','signal_max','#4ea9ff']].map(([name,key,color])=>({name,color,pts:(series.t||[]).map((t,i)=>[Date.parse(t),series[key]?.[i]]).filter(p=>Number.isFinite(p[0])&&has(p[1]))})).filter(s=>s.pts.length);
  if(signal.length){const box=el('section','s-card',undefined,chart);el('h2','','Signal strength (dB)',box);lineChart(box,signal,'dB',0,t=>period==='24h'?new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):new Date(t).toLocaleDateString([],{day:'numeric',month:'short'}));}
 if(!chart.children.length)el('p','muted','No data available for this period yet.',chart);
}
for(const[period,label]of[['24h','24 hours'],['7d','7 days'],['month','Month'],['daily','Daily by year'],['monthly','Monthly by year']]){
 const b=el('button','',label,tabs);b.type='button';b.onclick=()=>{tabs.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');renderPeriod(period)};
 if(period==='24h')b.classList.add('on');
}
year.onchange=()=>renderPeriod(activePeriod);
renderPeriod('24h');
</script></div></body></html>
