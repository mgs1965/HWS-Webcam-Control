<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meteobridge health</title>
<style>:root{color-scheme:dark;--bg:#071827;--card:#0e273b;--line:#2a4960;--text:#edf6ff;--muted:#a9bdce;--blue:#4ea9ff;--amber:#ffd166;--green:#4bd66a;--red:#ff6075}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,"Segoe UI",sans-serif}a{color:var(--blue)}.muted{color:var(--muted)}</style></head><body><div class="s-page">
<header class="s-head"><h1>Meteobridge health</h1><div class="s-nav muted">__NAV__</div></header>
<div class="s-grid" id="grid"></div>
<script type="application/json" id="data">__DATA__</script>
<script>
const raw=document.getElementById('data').textContent.trim(),D=raw.startsWith('{')?JSON.parse(raw):{},$=id=>document.getElementById(id),has=v=>v!==null&&v!==undefined&&v!==''&&isFinite(Number(v));
const el=(tag,cls,text,parent)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;if(parent)parent.append(e);return e};
const F=(v,d,u,delta)=>HWS.fmt(v,d,u,delta),NS='http://www.w3.org/2000/svg';
const tile=(box,k,v)=>{const t=el('div','s-tile',undefined,box);el('div','k',k,t);el('div','v',v,t)};
function bars(box,rows,color,unit,dig){/* rows: [label,value] */const w=700,h=190,pad=30,n=rows.length;if(!n){el('p','muted','No data yet',box);return}const mx=Math.max(...rows.map(r=>r[1]),0.1),bw=(w-pad)/n;let s='<svg viewBox="0 0 '+w+' '+(h+22)+'" style="width:100%;height:auto"><text x="0" y="12" fill="#a9bdce" font-size="11">'+F(mx,dig,unit)+'</text><line x1="'+pad+'" x2="'+w+'" y1="'+h+'" y2="'+h+'" stroke="#2a4960"/>';rows.forEach((r,i)=>{const bh=Math.max(r[1]/mx*(h-18),r[1]>0?1:0),x=pad+i*bw;s+='<rect x="'+(x+1).toFixed(1)+'" y="'+(h-bh).toFixed(1)+'" width="'+Math.max(bw-2,1).toFixed(1)+'" height="'+bh.toFixed(1)+'" fill="'+color+'"><title>'+r[0]+': '+F(r[1],dig,unit)+'</title></rect>';if(n<=14||i%Math.ceil(n/8)===0)s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(h+15)+'" fill="#a9bdce" font-size="10" text-anchor="middle">'+r[0]+'</text>'});box.insertAdjacentHTML('beforeend',s+'</svg>')}

const H=D.health||{},W=D.weather||{},C=D.compare||{},ICON={ok:'✅',warn:'⚠️',bad:'❌',unknown:'❔'};
let c=el('section','s-card',undefined,$('grid'));el('h2','',"Checks",c);
for(const k of H.checks||[]){const r=el('div','',undefined,c);r.style.cssText='display:flex;justify-content:space-between;gap:8px;padding:4px 0';el('span','',(ICON[k.status]||'')+' '+k.name,r);el('span','muted',k.detail,r)}
c=el('section','s-card',undefined,$('grid'));el('h2','',"History",c);const t=el('table','s-table',undefined,c);
for(const[a,b]of[['Days stored',H.days_stored],['First stored day',H.first_day],['Archive days (Meteobridge import)',H.archive_days],['Archive from',H.archive_first],['Archive to',H.archive_last],['Missing in last 30 days',(H.gaps||[]).join(', ')||'none']]){const r=t.insertRow();r.insertCell().textContent=a;r.insertCell().textContent=b??'–'}
c=el('section','s-card',undefined,$('grid'));el('h2','',"Source",c);const t2=el('table','s-table',undefined,c);
for(const[a,b]of[['Source',W.source],['Updated',W.updated],['Bridge data age (s)',W.bridge_data_age_s],['Station note',H.station_message]]){const r=t2.insertRow();r.insertCell().textContent=a;r.insertCell().textContent=b??'–'}
if((C.rows||[]).length){c=el('section','s-card',undefined,$('grid'));el('h2','',"Meteobridge vs clientraw",c);const t3=el('table','s-table',undefined,c);for(const r of C.rows){const x=t3.insertRow();x.insertCell().textContent=r.label;x.insertCell().textContent=String(r.meteobridge??'–');x.insertCell().textContent=String(r.clientraw??'–');x.insertCell().textContent=r.status||''}}
</script></div></body></html>
