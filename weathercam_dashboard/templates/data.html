<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All current readings</title>
<style>:root{color-scheme:dark;--bg:#071827;--card:#0e273b;--line:#2a4960;--text:#edf6ff;--muted:#a9bdce;--blue:#4ea9ff;--amber:#ffd166;--green:#4bd66a;--red:#ff6075}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,"Segoe UI",sans-serif}a{color:var(--blue)}.muted{color:var(--muted)}</style></head><body><div class="s-page">
<header class="s-head"><h1>All current readings</h1><div class="s-nav muted">__NAV__</div></header>
<div class="s-card s-scroll"><table class="s-table" id="tbl"></table></div><p class="muted" id="note"></p>
<script type="application/json" id="data">__DATA__</script>
<script>
const raw=document.getElementById('data').textContent.trim(),D=raw.startsWith('{')?JSON.parse(raw):{},$=id=>document.getElementById(id),has=v=>v!==null&&v!==undefined&&v!==''&&isFinite(Number(v));
const el=(tag,cls,text,parent)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;if(parent)parent.append(e);return e};
const F=(v,d,u,delta)=>HWS.fmt(v,d,u,delta),day=s=>new Date(s+'T12:00:00'),hm=s=>s?new Date(s).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'–';
const tile=(box,k,v)=>{const t=el('div','s-tile',undefined,box);el('div','k',k,t);el('div','v',v,t)};
const W=D.weather||{},UNITS={temperature_c:'°C',dew_point_c:'°C',heat_index_c:'°C',wet_bulb_c:'°C',wind_chill_c:'°C',temp_change_1h_c:'°C',humidity_percent:'%',pressure_hpa:'hPa',pressure_change_1h_hpa:'hPa',wind_speed_mph:'mph',wind_gust_mph:'mph',wind_gust_max_1h_mph:'mph',wind_gust_max_today_mph:'mph',rain_rate_mm_h:'mm/h',rain_today_mm:'mm',solar_radiation_wm2:'W/m²',sunshine_hours_today:'h'};
const t=$('tbl'),h=t.insertRow();for(const x of['Reading','Value']){const c=document.createElement('th');c.textContent=x;h.append(c)}
const keys=Object.keys(W).filter(k=>k!=='updated'&&k!=='source').sort();for(const k of keys){const r=t.insertRow();r.insertCell().textContent=k.replace(/_/g,' ');const v=W[k];let text=has(v)?F(v,Math.abs(v)<10?2:1,UNITS[k]?' '+UNITS[k]:'',/change/.test(k)):String(v);if(k==='wind_direction_deg'&&has(v))text=HWS.compass(v)+' ('+Number(v).toFixed(0)+'°)';r.insertCell().textContent=text}
$('note').textContent=W.updated?'Updated '+new Date(W.updated).toLocaleString()+' from '+(W.source||'the weather station')+'.':'No weather data yet.';
</script></div></body></html>
